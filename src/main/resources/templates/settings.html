<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" th:href="@{/css/styles.css}" />
<body th:replace="~{fragments/_layout :: layout(~{this :: pageContent}, 'settings')}">

<div th:fragment="pageContent">
    <h2 th:text="#{settings.title}">Settings</h2>
    <div class="form-row">
        <label>
            <input type="checkbox" id="high-contrast-toggle" onchange="toggleHighContrast()">
            <span th:text="#{settings.highContrast}">High Contrast</span>
        </label>
    </div>
    <div class="form-row">
        <label>
            <input type="checkbox" id="readable-font-toggle" onchange="toggleReadableFont()">
            <span th:text="#{settings.readableFont}">Readable Font</span>
        </label>
    </div>
</div>

</body>
</html>
