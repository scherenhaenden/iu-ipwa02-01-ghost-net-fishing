<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" th:href="@{/css/styles.css}" />
<body th:replace="~{fragments/_layout :: layout(~{this :: pageContent}, 'list')}">

<div th:fragment="pageContent">
    <h2 th:text="#{ghostnet.reserve.title}">Reserve Ghost Net</h2>

    <div class="ghostnet-details" th:if="${ghostNet != null}">
        <p><strong th:text="#{ghostnet.reserve.label.id}">ID:</strong> <span th:text="${ghostNet.id}"></span></p>
        <p><strong th:text="#{ghostnet.reserve.label.location}">Location:</strong> <span th:text="${ghostNet.location}"></span></p>
        <p><strong th:text="#{ghostnet.reserve.label.size}">Size:</strong> <span th:text="${ghostNet.size}"></span></p>
        <p><strong th:text="#{ghostnet.reserve.label.status}">Status:</strong> <span th:text="${ghostNet.status}"></span></p>
    </div>
    <div th:if="${ghostNet == null}">
        <p th:text="#{ghostnet.reserve.notFound}">Ghost Net not found (view only).</p>
    </div>

    <form th:action="@{/ui/ghostnets/{id}/reserve(id=${ghostNet.id})}" method="post" th:object="${reserveForm}">
        <div class="form-row">
            <label for="personName" th:text="#{ghostnet.reserve.label.personName}">Your name</label>
            <input type="text" id="personName" th:field="*{personName}" th:placeholder="#{ghostnet.reserve.placeholder.personName}" />
            <div class="field-error" th:if="${#fields.hasErrors('personName')}">
                <p th:errors="*{personName}"></p>
            </div>
        </div>
        <div>
            <button class="btn btn-primary" type="submit" th:text="#{ghostnet.reserve.button.submit}">Reserve</button>
            <a class="btn btn-ghost" th:href="@{/ui/ghostnets}" th:text="#{ghostnet.reserve.button.cancel}">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
